name: Auto PR

# feat/* 브랜치를 푸시하면 PR이 없을 때 자동 생성
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "mb/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          base="main"
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            if ! git show-ref --verify --quiet refs/remotes/origin/main; then
              base="master"
            fi
          fi
          # gh pr view 에는 --head 가 없다. 열린 PR만 보려면 gh pr list --head 를 쓴다.
          # gh pr view <branch> 는 머지된 PR도 찾아서, 같은 브랜치의 새 PR 생성을 막는다.
          open_pr="$(gh pr list --head "$branch" --json number --jq '.[0].number')"
          if [ -n "$open_pr" ]; then
            echo "PR already exists for $branch"
            exit 0
          fi
          printf -v body '## Summary\nAutomated PR for `%s`.\n\n## Test plan\n- [ ] CI green\n- [ ] Smoke-check the changed paths\n' "$branch"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "$branch" \
            --body "$body"
